services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8081/v1/api
        VITE_APP_TIMEZONE: America/Mexico_City
    restart: unless-stopped
    ports:
      # Bind explícito a IPv4: evita que el navegador se cuelgue en ::1
      # (pasta/Podman no reenvía IPv6 correctamente)
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8185}:8085"
