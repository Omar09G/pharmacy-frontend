# Nginx config for SPA (React/Vite)
server {
    listen 8085;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ────────────────────────────────────────────────────────

    # Evita clickjacking: la app no puede ser embebida en iframes externos
    add_header X-Frame-Options "DENY" always;

    # Previene MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Protección XSS para navegadores legacy
    add_header X-XSS-Protection "1; mode=block" always;

    # Fuerza HTTPS por 2 años (activar solo cuando el servidor tenga TLS).
    # Rollout seguro: empezar con max-age=300 y subir gradualmente a
    # 63072000 cuando se confirme que todo el tráfico funciona sobre HTTPS.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Controla qué información se envía en el header Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restringe acceso a APIs del navegador (cámara, micrófono, geolocalización)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy
    # ⚠️  Ajustar connect-src al dominio real de la API en producción
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self' http://localhost:8081 https://localhost:8081;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
    " always;

    # ── Routing SPA ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
     # Proxy API requests to your backend
    location /api/ {
        proxy_pass http://localhost:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Generate UUID4 variable
    set_by_lua_block $request_uuid4 {
        local uuid = require "uuid"
        return uuid.gen("v4")
    }

    # Cacheo de assets estáticos con hash (Vite genera nombres únicos)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
            # Pass UUID to upstream
            proxy_set_header X-Request-ID $request_uuid4;
            
            # SPA Routing
            try_files $uri $uri/ /index.html;
        }

    # No cachear el HTML principal (siempre se sirve fresco)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    # Logging with Trace ID
    log_format traceid '$http_x_trace_id - $remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log traceid;
}
