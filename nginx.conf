# Nginx config for SPA (React/Vite)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ────────────────────────────────────────────────────────

    # Evita clickjacking: la app no puede ser embebida en iframes externos
    add_header X-Frame-Options "DENY" always;

    # Previene MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Protección XSS para navegadores legacy
    add_header X-XSS-Protection "1; mode=block" always;

    # Fuerza HTTPS por 2 años (activar solo cuando el servidor tenga TLS)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Controla qué información se envía en el header Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restringe acceso a APIs del navegador (cámara, micrófono, geolocalización)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy
    # ⚠️  Ajustar connect-src al dominio real de la API en producción
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self' http://localhost:8080 https://localhost:8080;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
    " always;

    # ── Routing SPA ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo de assets estáticos con hash (Vite genera nombres únicos)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cachear el HTML principal (siempre se sirve fresco)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
