<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Farmacia Santo Niño — Sistema de gestión de farmacia: punto de venta, inventario y más."
    />
    <meta name="theme-color" content="#047857" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1411" media="(prefers-color-scheme: dark)" />
    <title>Pharmacy Santo Niño</title>
    <script>
      (function () {
        try {
          var ui = JSON.parse(localStorage.getItem('pharmacy_ui') || '{}');
          var t = (ui && ui.state && ui.state.theme) || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
